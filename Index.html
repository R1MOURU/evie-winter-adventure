<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#172638">
  <title>EVIE: A Winter Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="game">

    <header class="game-header">
      <div class="game-title">EVIE</div>
      <div class="game-subtitle">A Winter Adventure</div>
    </header>

    <section id="game-screen">

      <canvas id="game-canvas" width="270" height="480">
        Your browser does not support canvas.
      </canvas>

      <div id="intro-screen" class="screen">
        <div class="intro-content">
          <h1>A Winter Adventure</h1>
          <p>A little journey through a snowy forest...</p>
          <button id="start-button">Start Adventure</button>
        </div>
      </div>

      <div id="dialogue-box" class="dialogue-box hidden">
        <p id="dialogue-text"></p>
        <button id="dialogue-button">Continue</button>
      </div>

      <div id="battle-screen" class="screen hidden">
        <div class="battle-panel">
          <h2 id="enemy-name">Enemy</h2>
          <div class="health-container">
            <div class="health-bar">
              <div id="enemy-health" class="health-fill"></div>
            </div>
          </div>

          <p id="battle-message">An enemy appeared!</p>

          <div id="battle-actions">
            <button id="attack-button">Coffee Splash</button>
            <button id="heal-button">Text My Boyfriend</button>
          </div>
        </div>
      </div>

      <div id="ending-screen" class="screen hidden">
        <div class="ending-content">
          <h1>Finally, the beach!</h1>
          <p id="ending-message"></p>
        </div>
      </div>

    </section>

    <footer class="game-footer">
      <p>Made with love ❤️</p>
    </footer>

  </main>

  <script src="game.js"></script>
</body>
</html>
